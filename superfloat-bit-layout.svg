<text x="1222.0" y="618" font-size="16" font-weight="700" fill="#DC2626" text-anchor="end">SmolLM2-360M: max |w| = 7.47</text>
<text x="1222.0" y="640" font-size="14" fill="#DC2626" text-anchor="end">0.014% of weights — clipping them destroys the model</text>
<text x="1222.0" y="660" font-size="14" fill="#DC2626" text-anchor="end">even at 16 bits, where precision is not the issue</text>
<line x1="316.0" y1="764" x2="316.0" y2="778" stroke="#6B7280" stroke-width="1.2" opacity="0.5"/>
<rect x="700" y="796" width="606" height="82" rx="10" fill="#F3F6FC" stroke="#C9D6EF" stroke-width="1.4"/>
<text x="722" y="822" font-size="15" font-weight="700" fill="#111827">The fix is not more bits — it is a scale</text>
<text x="722" y="844" font-size="14" fill="#374151">Give every matmul a per-channel scale and the model comes back intact.</text>
<text x="722" y="864" font-size="14" fill="#374151">The neighbouring norm absorbs it, so it never enters inference arithmetic.</text>
<text x="60" y="916" font-size="14" fill="#6B7280">All figures measured in github.com/aloshdenny/superfloat · MIT · 878 archived training runs</text>
